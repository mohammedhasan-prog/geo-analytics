services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    environment:
      REDIS_URL: redis://redis:6379/0
      DATABASE_PATH: /app/data/geospatial.sqlite3
      UPLOAD_DIRECTORY: /app/data/uploads
      CACHE_TTL_SECONDS: ${CACHE_TTL_SECONDS:-86400}
      ASYNC_THRESHOLD_BYTES: ${ASYNC_THRESHOLD_BYTES:-5242880}
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - app_data:/app/data
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  worker:
    build: .
    command: ["rq", "worker", "--url", "redis://redis:6379/0", "--serializer", "json", "geospatial-measurements"]
    environment:
      REDIS_URL: redis://redis:6379/0
      DATABASE_PATH: /app/data/geospatial.sqlite3
      UPLOAD_DIRECTORY: /app/data/uploads
      CACHE_TTL_SECONDS: ${CACHE_TTL_SECONDS:-86400}
    volumes:
      - app_data:/app/data
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  app_data:
  redis_data:
